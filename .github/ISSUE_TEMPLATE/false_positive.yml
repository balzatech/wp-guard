name: False positive
description: wp-guard flagged something that is legitimate
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        False positives are the most useful reports: they let us tighten a rule for everyone. Please do **not** attach a real malware sample; a short snippet of the legitimate code is enough.
  - type: input
    id: version
    attributes:
      label: wp-guard version
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the line(s) from the report, including the rule description.
      render: text
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Plugin or theme (name and version) the file belongs to
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal snippet that triggers it
      description: Only the few lines that match. No secrets.
      render: php
  - type: textarea
    id: why
    attributes:
      label: Why is it legitimate?
