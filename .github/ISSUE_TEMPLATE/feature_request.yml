name: Feature request
description: An idea to improve wp-guard
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like wp-guard to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
