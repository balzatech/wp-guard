name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Test suite (fake WordPress site + simulated wp-cli)
        run: bash tests/run.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (warnings and errors fail the build)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No CRLF line endings in shell code
        run: |
          if grep -rIl $'\r' bin lib checks tests install.sh Makefile; then
            echo "CRLF found in the files above (bash cannot run them)"; exit 1
          fi
      - name: Scripts are executable
        run: |
          for f in bin/* install.sh tests/run.sh tests/stub/wp; do
            [ -x "$f" ] || { echo "not executable: $f"; exit 1; }
          done
